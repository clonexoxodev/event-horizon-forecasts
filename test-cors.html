<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CORS Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .test-result {
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
        }
        .success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }
        .error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
        button {
            background: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #0056b3;
        }
        pre {
            background: #f5f5f5;
            padding: 10px;
            border-radius: 5px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <h1>🔍 CORS & Login Test</h1>
    <p>Test if your backend CORS is working correctly</p>

    <button onclick="testCORS()">Test CORS</button>
    <button onclick="testLogin()">Test Login</button>
    <button onclick="testSignup()">Test Signup</button>

    <div id="results"></div>

    <script>
        const API_URL = 'https://flippe-backend4-git-main-clonexoxodevs-projects.vercel.app';
        const resultsDiv = document.getElementById('results');

        function showResult(title, data, isError = false) {
            const resultDiv = document.createElement('div');
            resultDiv.className = `test-result ${isError ? 'error' : 'success'}`;
            resultDiv.innerHTML = `
                <h3>${title}</h3>
                <pre>${JSON.stringify(data, null, 2)}</pre>
            `;
            resultsDiv.insertBefore(resultDiv, resultsDiv.firstChild);
        }

        async function testCORS() {
            try {
                const response = await fetch(`${API_URL}/api/health`, {
                    method: 'GET',
                    credentials: 'include',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });

                const data = await response.json();
                
                showResult('✅ CORS Test Passed', {
                    status: response.status,
                    statusText: response.statusText,
                    headers: {
                        'access-control-allow-origin': response.headers.get('access-control-allow-origin'),
                        'access-control-allow-credentials': response.headers.get('access-control-allow-credentials')
                    },
                    data
                });
            } catch (error) {
                showResult('❌ CORS Test Failed', {
                    error: error.message,
                    note: 'CORS is blocking the request'
                }, true);
            }
        }

        async function testLogin() {
            try {
                const response = await fetch(`${API_URL}/api/auth/login`, {
                    method: 'POST',
                    credentials: 'include',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: 'fehintoluwaolu@gmail.com',
                        password: 'fehin0706'
                    })
                });

                const data = await response.json();
                
                if (response.ok) {
                    showResult('✅ Login Test Passed', {
                        status: response.status,
                        message: 'Login successful!',
                        data
                    });
                } else {
                    showResult('⚠️ Login Failed (but CORS works)', {
                        status: response.status,
                        message: data.error?.message || data.message,
                        note: 'CORS is working, but login credentials may be wrong or user does not exist'
                    });
                }
            } catch (error) {
                showResult('❌ Login Test Failed', {
                    error: error.message,
                    note: 'CORS is blocking the request'
                }, true);
            }
        }

        async function testSignup() {
            const timestamp = Date.now();
            try {
                const response = await fetch(`${API_URL}/api/auth/signup`, {
                    method: 'POST',
                    credentials: 'include',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: `testuser_${timestamp}`,
                        email: `test_${timestamp}@example.com`,
                        password: 'TestPassword123!'
                    })
                });

                const data = await response.json();
                
                if (response.ok) {
                    showResult('✅ Signup Test Passed', {
                        status: response.status,
                        message: 'Signup successful!',
                        data
                    });
                } else {
                    showResult('⚠️ Signup Failed (but CORS works)', {
                        status: response.status,
                        message: data.error?.message || data.message,
                        note: 'CORS is working, but signup failed for another reason'
                    });
                }
            } catch (error) {
                showResult('❌ Signup Test Failed', {
                    error: error.message,
                    note: 'CORS is blocking the request'
                }, true);
            }
        }

        // Auto-test CORS on load
        window.onload = () => {
            testCORS();
        };
    </script>
</body>
</html>
