<!DOCTYPE html>
<html>
<head>
    <title>Direct Backend Test</title>
    <style>
        body { font-family: Arial; padding: 20px; max-width: 800px; margin: 0 auto; }
        .result { padding: 15px; margin: 10px 0; border-radius: 5px; }
        .success { background: #d4edda; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; border: 1px solid #f5c6cb; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        pre { background: #f5f5f5; padding: 10px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>🔍 Direct Backend Test</h1>
    
    <h2>Test 1: Check if backend is responding</h2>
    <button onclick="testBackend()">Test Backend Health</button>
    <div id="backend-result"></div>

    <h2>Test 2: Check CORS headers</h2>
    <button onclick="testCORS()">Test CORS</button>
    <div id="cors-result"></div>

    <h2>Test 3: Try Login</h2>
    <input type="email" id="email" placeholder="Email" value="test@example.com" style="padding: 10px; width: 300px;">
    <br><br>
    <input type="password" id="password" placeholder="Password" value="password123" style="padding: 10px; width: 300px;">
    <br><br>
    <button onclick="testLogin()">Test Login</button>
    <div id="login-result"></div>

    <h2>Test 4: Check All Endpoints</h2>
    <button onclick="testAllEndpoints()">Test All Endpoints</button>
    <div id="endpoints-result"></div>

    <script>
        const API_URL = 'https://flippe-backend4-git-main-clonexoxodevs-projects.vercel.app';

        function showResult(id, html, isError = false) {
            document.getElementById(id).innerHTML = `<div class="result ${isError ? 'error' : 'success'}">${html}</div>`;
        }

        async function testBackend() {
            try {
                const response = await fetch(`${API_URL}/api/health`);
                const data = await response.json();
                
                showResult('backend-result', `
                    <h3>✅ Backend is UP!</h3>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                    <p>Status: ${response.status}</p>
                `);
            } catch (error) {
                showResult('backend-result', `
                    <h3>❌ Backend Error</h3>
                    <p>${error.message}</p>
                `, true);
            }
        }

        async function testCORS() {
            try {
                const response = await fetch(`${API_URL}/api/health`, {
                    method: 'GET',
                    credentials: 'include',
                    headers: { 'Content-Type': 'application/json' }
                });

                const allowOrigin = response.headers.get('access-control-allow-origin');
                const allowCreds = response.headers.get('access-control-allow-credentials');
                
                showResult('cors-result', `
                    <h3>${allowOrigin ? '✅' : '❌'} CORS Headers</h3>
                    <p>Allow-Origin: ${allowOrigin || 'NOT SET'}</p>
                    <p>Allow-Credentials: ${allowCreds || 'NOT SET'}</p>
                    <p>Expected Origin: https://event-horizon-forecasts.vercel.app</p>
                    ${allowOrigin === 'https://event-horizon-forecasts.vercel.app' || allowOrigin === '*' ? 
                        '<p style="color: green;">✅ CORS is configured correctly!</p>' : 
                        '<p style="color: red;">❌ CORS is NOT configured for your frontend!</p>'}
                `, !allowOrigin);
            } catch (error) {
                showResult('cors-result', `
                    <h3>❌ CORS Test Failed</h3>
                    <p>${error.message}</p>
                    <p>This means CORS is blocking the request</p>
                `, true);
            }
        }

        async function testLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch(`${API_URL}/api/auth/login`, {
                    method: 'POST',
                    credentials: 'include',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();
                
                if (response.ok) {
                    showResult('login-result', `
                        <h3>✅ Login Successful!</h3>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `);
                } else {
                    showResult('login-result', `
                        <h3>⚠️ Login Failed</h3>
                        <p>Status: ${response.status}</p>
                        <p>Error: ${data.error?.message || data.message}</p>
                        <p>This might be wrong credentials, not a system error</p>
                    `);
                }
            } catch (error) {
                showResult('login-result', `
                    <h3>❌ Login Request Failed</h3>
                    <p>${error.message}</p>
                    <p>CORS is blocking the request!</p>
                `, true);
            }
        }

        // Auto-test on load
        window.onload = () => {
            testBackend();
            setTimeout(testCORS, 1000);
        };

        async function testAllEndpoints() {
            const endpoints = [
                '/api',
                '/api/health',
                '/api/auth/login',
                '/api/wallet',
                '/api/markets'
            ];

            let results = '<h3>Testing All Endpoints:</h3>';
            
            for (const endpoint of endpoints) {
                try {
                    const response = await fetch(`${API_URL}${endpoint}`, {
                        method: 'GET',
                        credentials: 'include'
                    });
                    
                    const status = response.status;
                    const statusText = response.statusText;
                    
                    if (status === 200 || status === 401) {
                        results += `<p>✅ ${endpoint} - ${status} ${statusText}</p>`;
                    } else if (status === 404) {
                        results += `<p>❌ ${endpoint} - 404 NOT FOUND (route not loaded)</p>`;
                    } else {
                        results += `<p>⚠️ ${endpoint} - ${status} ${statusText}</p>`;
                    }
                } catch (error) {
                    results += `<p>❌ ${endpoint} - ERROR: ${error.message}</p>`;
                }
            }
            
            showResult('endpoints-result', results);
        }
    </script>
</body>
</html>
